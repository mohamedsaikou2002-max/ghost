<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06130e">
  <meta name="description" content="Casper · Offline-first RF and biomedical research interface. All preview signals are synthetic.">
  <title>Casper — Research Console</title>
  <link rel="icon" href="casper-icon.png">
  <link rel="apple-touch-icon" href="casper-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-frame">
    <aside class="sidebar">
      <div class="brand"><img src="casper-icon.png" alt="Casper ghost icon"><div><strong>CASPER</strong><span>RESEARCH SYSTEMS</span></div></div>
      <div class="space-label">WORKSPACE / LOCAL</div>
      <nav id="desktopNav" aria-label="Main navigation"></nav>
      <div class="sidebar-foot"><span class="status-dot"></span> LOCAL MODE <span class="pill muted-pill">v0.1</span><p>No account. No cloud collection. Explicit test data only.</p></div>
    </aside>
    <main class="main-panel">
      <header class="topbar"><div><span class="eyebrow">RESEARCH CONSOLE / CASPER LAB</span><h1 id="pageTitle">Overview</h1></div><div class="header-right"><span class="green-dot"></span><span>OFFLINE READY</span></div></header>
      <div class="content" id="content"></div>
      <div class="mobile-nav" id="mobileNav"></div>
    </main>
  </div>
  <script src="app.js" defer></script>
  <script>if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
</body>
</html>
